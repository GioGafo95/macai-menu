<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f1">
  <meta name="robots" content="noindex">
  <title>Modo mesero</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mesero">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-mode="mesero">
  <header class="staff-bar hidden" id="staff-bar">
    <img src="/logo.png" alt="Macaí Bowls" class="staff-logo" width="1492" height="596">
    <button class="staff-btn" id="waiter-btn" title="Cambiar nombre">🧑‍🍳 <span id="waiter-name">Tu nombre</span></button>
    <span class="staff-spacer"></span>
    <button class="staff-btn" id="staff-orders">📋 Pedidos</button>
    <button class="staff-btn ghost" id="staff-logout" aria-label="Cerrar sesión">Salir</button>
  </header>

  <nav class="cats" aria-label="Categorías"><div class="cats-inner" id="cats"></div></nav>

  <main id="menu"><div class="spinner" aria-label="Cargando"></div></main>

  <div class="cart-bar hidden" id="cart-bar">
    <button class="btn btn-lg btn-block" id="open-cart">
      <span><span class="count" id="cart-count">0</span>&nbsp; Ver pedido</span>
      <span id="cart-total">$0</span>
    </button>
  </div>

  <div id="sheet-root"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
