<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f1">
  <title>Menú · Haz tu pedido</title>
  <meta name="description" content="Haz tu pedido de comida saludable en línea.">
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1 class="sr-only" id="biz-name">Macaí Bowls</h1>
      <img class="hero-logo" src="/logo.png" alt="Macaí Bowls" width="1492" height="596">
      <p id="biz-tagline"></p>
      <div class="hero-meta" id="hero-meta"></div>
    </div>
  </header>
  <div id="closed" class="closed-banner hidden"></div>

  <nav class="cats" aria-label="Categorías"><div class="cats-inner" id="cats"></div></nav>

  <main id="menu"><div class="spinner" aria-label="Cargando"></div></main>

  <div class="cart-bar hidden" id="cart-bar">
    <button class="btn btn-lg btn-block" id="open-cart">
      <span><span class="count" id="cart-count">0</span>&nbsp; Ver pedido</span>
      <span id="cart-total">$0</span>
    </button>
  </div>

  <div id="sheet-root"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
