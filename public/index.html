<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f1">
  <title>Menú · Haz tu pedido</title>
  <meta name="description" content="Haz tu pedido de comida saludable en línea.">
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="shop">
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="sr-only" id="biz-name">Macaí Bowls</h1>
      <img class="topbar-logo" src="/logo.png" alt="Macaí Bowls" width="1492" height="596">
      <span class="status" id="status"></span>
      <span class="topbar-spacer"></span>
      <a class="topbar-link hidden" id="last-order">📦 Mi pedido</a>
    </div>
  </header>
  <div id="closed" class="closed-banner hidden"></div>
  <section class="hero-wrap" id="hero" aria-label="Destacado"></section>
  <div class="ways" id="ways"></div>

  <nav class="cats" aria-label="Categorías"><div class="cats-inner" id="cats"></div></nav>

  <main id="menu"><div class="spinner" aria-label="Cargando"></div></main>

  <div class="cart-bar hidden" id="cart-bar">
    <button class="btn btn-lg btn-block" id="open-cart">
      <span class="cart-left"><span class="cart-ico" aria-hidden="true">🛍️</span><span class="count" id="cart-count">0</span> Ver mi pedido</span>
      <span id="cart-total">$0</span>
    </button>
  </div>

  <div id="sheet-root"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
