<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12304a">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel · Pedidos</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin">
  <!-- Login -->
  <div id="login" class="login hidden">
    <form class="card login-card" id="login-form">
      <img class="login-logo" src="/logo.png" alt="Macaí Bowls">
      <h1>Panel de administración</h1>
      <div class="field">
        <label for="pw">Contraseña</label>
        <input class="input" type="password" id="pw" autocomplete="current-password" required>
      </div>
      <div class="error-msg hidden" id="login-error" role="alert"></div>
      <button class="btn btn-lg btn-block" style="margin-top:16px">Entrar</button>
    </form>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="top-brand"><img src="/logo.png" alt="Macaí Bowls"><span id="top-name">Panel</span></div>
        <div class="topbar-actions">
          <label class="switch" title="Recibir pedidos">
            <input type="checkbox" id="store-open"><span class="slider"></span>
            <span class="switch-label" id="store-open-label">Abierto</span>
          </label>
          <button class="btn btn-ghost btn-sm" id="sound-btn" title="Sonido de nuevos pedidos">🔕</button>
          <button class="btn btn-ghost btn-sm" id="logout" title="Cerrar sesión">Salir</button>
        </div>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="orders" class="active"><span>📋</span>Pedidos<em class="badge hidden" id="new-badge"></em></button>
        <button data-tab="menu"><span>🥗</span>Menú</button>
        <button data-tab="toppings"><span>🧩</span>Toppings</button>
        <button data-tab="delivery"><span>🛵</span>Envío</button>
        <button data-tab="settings"><span>⚙️</span>Ajustes</button>
      </nav>
    </header>
    <main class="admin-main" id="view"></main>
  </div>

  <div id="sheet-root"></div>
  <script src="/admin/admin.js" type="module"></script>
</body>
</html>
